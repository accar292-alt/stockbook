<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ใบเบิกจ่าย/ใบรับเข้าสินค้า</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap">
<style>
  @page { size: A4; margin: 15mm; }
  body { font-family: "Sarabun", "Leelawadee UI", "Segoe UI", Tahoma, sans-serif; font-size: 10.5pt; line-height: 1.4; color: #000; margin: 0; background: #e9ecf0; }
  .page { background: #fff; max-width: 190mm; margin: 16px auto; padding: 12mm; position: relative; }
  .tools { max-width: 190mm; margin: 16px auto 0; display: flex; gap: 8px; }
  .tools button { font: inherit; padding: 8px 16px; cursor: pointer; }
  h1 { font-size: 1.25em; text-align: center; margin: 0; }
  h2 { font-size: 1.35em; text-align: center; margin: 6px 0 14px; }
  .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 24px; margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { border: 1px solid #000; padding: 5px 8px; }
  th { background: #eee; }
  .c { text-align: center; } .r { text-align: right; }
  .signs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 48px; text-align: center; }
  .signs div { line-height: 1.9; }
  .void { position: absolute; top: 38%; left: 0; right: 0; text-align: center; font-size: 90px; font-weight: 700;
          color: rgba(200, 30, 30, .25); transform: rotate(-20deg); pointer-events: none; }
  .foot { margin-top: 18px; font-size: .8em; color: #555; }
  @media print { body { background: #fff; } .tools { display: none; } .page { margin: 0; padding: 0; max-width: none; } }
</style>
</head>
<body>
<div class="tools"><button onclick="window.print()">🖨 พิมพ์</button><button onclick="window.close()">ปิด</button></div>
<div class="page" id="page">กำลังโหลด...</div>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = (d) => `${d.slice(8, 10)}/${d.slice(5, 7)}/${Number(d.slice(0, 4)) + 543}`;
const num = (n) => Number(n).toLocaleString('th-TH');
// ราคาปก: แสดงอย่างเดียว ไม่นำไปคำนวณมูลค่า
const baht = (n) => { const v = Number(n || 0); return v.toLocaleString('th-TH', { minimumFractionDigits: Number.isInteger(v) ? 0 : 2, maximumFractionDigits: 2 }); };
(async () => {
  const page = document.getElementById('page');
  const id = Number(new URLSearchParams(location.search).get('id'));
  const res = await fetch('/api/docs/' + id);
  const data = await res.json();
  if (!res.ok) { page.textContent = data.error || 'ไม่พบเอกสาร'; return; }
  const d = data.doc, out = d.type === 'OUT', dmg = d.type === 'DMG';
  document.title = d.doc_no;
  // [ตำแหน่ง, ชื่อที่พิมพ์ไว้ในวงเล็บ] — ผู้เบิก/ผู้รายงาน/ผู้รับเข้าคลัง คือผู้ที่ login บันทึกเอกสาร
  const signs = dmg ? [['ผู้รายงาน', d.party], ['ผู้ตรวจสอบ'], ['ผู้อนุมัติ']]
    : out ? [['ผู้เบิก', d.party], ['ผู้จ่ายสินค้า'], ['ผู้อนุมัติ']]
    : [['ผู้ส่งมอบ'], ['ผู้รับเข้าคลัง', d.created_by_name], ['ผู้ตรวจสอบ']];
  page.innerHTML = `${d.cancelled ? '<div class="void">ยกเลิก</div>' : ''}
    <h1>${esc(data.orgName)}</h1><h2>${dmg ? 'ใบตัดสินค้าชำรุด/เสียหาย' : out ? 'ใบเบิกจ่ายสินค้า' : 'ใบรับเข้าสินค้า'}</h2>
    <div class="meta">
      <div><b>${dmg ? 'ผู้รายงาน' : out ? 'ผู้เบิก' : 'ผู้รับเข้า'}:</b> ${esc(out || dmg ? d.party : d.created_by_name) || '-'}</div><div><b>เลขที่:</b> ${esc(d.doc_no)}</div>
      <div>${out ? `<b>ชื่อหน่วยงาน:</b> ${esc(d.dept) || '-'}` : dmg ? `<b>สาเหตุ:</b> ${esc(d.reason) || '-'}` : `<b>รับจากใบรับงานเลขที่:</b> ${esc(d.party) || '-'}`}</div><div><b>วันที่:</b> ${fmtDate(d.date)}</div>
      ${out ? `<div style="grid-column:1/3"><b>ใบสั่งซื้อเลขที่:</b> ${esc(d.po_no) || '-'}</div>` : ''}
      <div style="grid-column:1/3"><b>หมายเหตุ:</b> ${esc(d.note) || '-'}</div>
    </div>
    <table><thead><tr><th style="width:40px">ลำดับ</th><th style="width:90px">รหัส</th><th>รายการ</th><th style="width:80px">ราคาปก<br>(บาท)</th><th style="width:80px">จำนวน</th><th style="width:60px">หน่วย</th></tr></thead>
    <tbody>${d.items.map((it, i) => `<tr><td class="c">${i + 1}</td><td>${esc(it.code)}</td><td>${esc(it.name)}</td><td class="r">${baht(it.price)}</td><td class="r">${num(it.qty)}</td><td class="c">${esc(it.unit)}</td></tr>`).join('')}</tbody>
    <tfoot><tr><th colspan="4" class="r">รวม ${d.items.length} รายการ</th><th class="r">${num(d.items.reduce((s, it) => s + it.qty, 0))}</th><th></th></tr></tfoot></table>
    <div class="signs">${signs.map(([s, name]) => `<div>ลงชื่อ ..............................................<br>( ${name ? esc(name) : '..............................................'} )<br>${s}<br>วันที่ ......... / ......... / .........</div>`).join('')}</div>
    <div class="foot">บันทึกโดย ${esc(d.created_by_name)}${d.cancelled ? ` · ยกเลิกโดย ${esc(d.cancelled_by_name)}` : ''}</div>`;
  if (new URLSearchParams(location.search).get('print') === '1') { await document.fonts.ready; window.print(); }
})();
</script>
</body>
</html>
